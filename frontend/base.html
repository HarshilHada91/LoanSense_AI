<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}LoanSense AI - Intelligent Loan Risk Assessment{%
      endblock %}
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #0a0f1a;
        --bg-secondary: #111827;
        --bg-tertiary: #1f2937;
        --bg-card: rgba(17, 24, 39, 0.95);
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;
        --accent-primary: #3b82f6;
        --accent-secondary: #10b981;
        --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
        --accent-gradient-hover: linear-gradient(
          135deg,
          #2563eb 0%,
          #059669 100%
        );
        --border-color: rgba(75, 85, 99, 0.3);
        --border-glow: rgba(59, 130, 246, 0.3);
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --card-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        --card-shadow-hover:
          0 20px 25px -5px rgba(0, 0, 0, 0.4),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-height: 100vh;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Background */
      .bg-mesh {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--bg-primary);
      }

      .bg-mesh::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 80% 60% at 10% 0%,
            rgba(59, 130, 246, 0.12) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 60% 50% at 90% 100%,
            rgba(16, 185, 129, 0.08) 0%,
            transparent 50%
          );
      }

      /* Navbar */
      .navbar {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        padding: 0.75rem 0;
        transition: all 0.3s ease;
      }

      .navbar.scrolled {
        box-shadow: var(--card-shadow);
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1.4rem;
        color: var(--text-primary) !important;
      }

      .brand-logo {
        width: 44px;
        height: 44px;
        background: var(--accent-gradient);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.2rem;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        transition: transform 0.3s ease;
      }

      .navbar-brand:hover .brand-logo {
        transform: scale(1.05);
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .brand-text span:first-child {
        font-size: 1.25rem;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .brand-text span:last-child {
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      .nav-link {
        color: var(--text-secondary) !important;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.5rem 1rem !important;
        border-radius: 8px;
        margin: 0 4px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-link:hover {
        color: var(--text-primary) !important;
        background: var(--bg-tertiary);
      }

      .nav-link.active {
        background: var(--accent-gradient);
        color: white !important;
      }

      .nav-link i {
        font-size: 1rem;
      }

      /* Main Content */
      .main-content {
        padding: 60px 0;
        min-height: calc(100vh - 140px);
      }

      /* Page Header */
      .page-header {
        text-align: center;
        margin-bottom: 48px;
      }

      .page-header .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid var(--border-glow);
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--accent-primary);
        margin-bottom: 16px;
      }

      .page-header h1 {
        font-size: 2.75rem;
        font-weight: 800;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }

      .page-header h1 i {
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-right: 12px;
      }

      .page-header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
      }

      /* Cards */
      .card-main {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .card-main:hover {
        box-shadow: var(--card-shadow-hover);
        border-color: var(--border-glow);
      }

      .card-header-gradient {
        background: var(--accent-gradient);
        padding: 24px 32px;
        position: relative;
        overflow: hidden;
      }

      .card-header-gradient::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -20%;
        width: 60%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 60%
        );
      }

      .card-header-gradient h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .card-body-content {
        padding: 32px;
      }

      /* Section Title */
      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      .section-label .icon-wrap {
        width: 46px;
        height: 46px;
        background: var(--accent-gradient);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.1rem;
      }

      .section-label h5 {
        margin: 0;
        font-weight: 700;
        font-size: 1.1rem;
      }

      /* Form Elements */
      .form-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-label i {
        color: var(--accent-primary);
        font-size: 0.9rem;
      }

      .form-control,
      .form-select {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      .form-control:focus,
      .form-select:focus {
        background: var(--bg-tertiary);
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        color: var(--text-primary);
      }

      .form-control::placeholder {
        color: var(--text-muted);
      }

      .form-select option {
        background: var(--bg-secondary);
        color: var(--text-primary);
      }

      /* Buttons */
      .btn-primary-main {
        background: var(--accent-gradient);
        border: none;
        padding: 14px 32px;
        font-weight: 600;
        font-size: 1rem;
        border-radius: 12px;
        color: white;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .btn-primary-main:hover {
        background: var(--accent-gradient-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        color: white;
      }

      .btn-secondary-main {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        padding: 14px 32px;
        font-weight: 600;
        font-size: 1rem;
        border-radius: 12px;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .btn-secondary-main:hover {
        background: var(--bg-secondary);
        border-color: var(--accent-primary);
        color: var(--text-primary);
        transform: translateY(-2px);
      }

      /* Stats Cards */
      .stat-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        transition: all 0.3s ease;
      }

      .stat-box:hover {
        border-color: var(--border-glow);
        transform: translateY(-4px);
        box-shadow: var(--card-shadow-hover);
      }

      .stat-box .stat-icon {
        width: 56px;
        height: 56px;
        background: rgba(59, 130, 246, 0.1);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 1.5rem;
        color: var(--accent-primary);
        transition: all 0.3s ease;
      }

      .stat-box:hover .stat-icon {
        background: var(--accent-gradient);
        color: white;
        transform: scale(1.1);
      }

      .stat-box h3 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .stat-box p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
      }

      /* Footer */
      .footer {
        background: var(--bg-card);
        border-top: 1px solid var(--border-color);
        padding: 20px 0;
        text-align: center;
      }

      .footer p {
        color: var(--text-secondary);
        margin: 0;
        font-size: 0.9rem;
      }

      .footer a {
        color: var(--accent-primary);
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      /* Utilities */
      .text-gradient {
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .btn-group-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 32px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--bg-tertiary);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-primary);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .page-header h1 {
          font-size: 1.75rem;
        }

        .card-body-content {
          padding: 20px;
        }

        .navbar-brand {
          font-size: 1.1rem;
        }

        .brand-text span:last-child {
          display: none;
        }
      }

      /* Loading */
      .spinner-loading {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spinAnim 0.8s linear infinite;
      }

      @keyframes spinAnim {
        to {
          transform: rotate(360deg);
        }
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-in {
        animation: fadeUp 0.5s ease forwards;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- Background -->
    <div class="bg-mesh"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" id="mainNav">
      <div class="container">
        <a class="navbar-brand" href="/">
          <div class="brand-logo">
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="brand-text">
            <span>LoanSense AI</span>
            <span>Smart Risk Analysis</span>
          </div>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <i
            class="fas fa-bars"
            style="color: var(--text-primary); font-size: 1.25rem"
          ></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a
                class="nav-link {% if active_page == 'home' %}active{% endif %}"
                href="/"
              >
                <i class="fas fa-home"></i> Home
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if active_page == 'about' %}active{% endif %}"
                href="/about"
              >
                <i class="fas fa-info-circle"></i> About
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if active_page == 'stats' %}active{% endif %}"
                href="/stats"
              >
                <i class="fas fa-chart-bar"></i> Statistics
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">{% block content %}{% endblock %}</div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>
          <i class="fas fa-shield-alt" style="color: var(--accent-primary)"></i>
          LoanSense AI &copy; 2026
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Navbar scroll effect
      window.addEventListener("scroll", () => {
        document
          .getElementById("mainNav")
          .classList.toggle("scrolled", window.scrollY > 30);
      });
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
